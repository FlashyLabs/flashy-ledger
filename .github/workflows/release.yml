name: Release

# Publishing is driven by a tag, not by a branch. A push to main should never
# be able to move what consumers resolve — that is the whole reason this
# package moved off `#main` in the first place.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Verify, then publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci

      # The full gate runs again here rather than trusting the CI run on the
      # commit. A tag can be moved; a release that publishes without re-checking
      # is a release nobody verified.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests and coverage gate
        run: npm run coverage
      - name: Build
        run: npm run build

      # The tag and the manifest must agree, or `v0.2.0` publishes 0.1.0 and
      # every consumer's lockfile records a version that was never released.
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
