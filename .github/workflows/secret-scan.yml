# Secret scanning — the control that would have caught the AUTH_SECRET.
# Scans the working tree (not history) so it blocks NEW committed secrets without
# failing on already-known historical values pending rotation. History scanning
# is enabled per-repo after those values are rotated.
name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks (working tree)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1
